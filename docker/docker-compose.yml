version: '3.8'

services:
  # COGNITIVE RUNTIME PLATFORM
  runtime-gateway:
    build:
      context: ..
      dockerfile: docker/runtime.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      - redis
      - ollama
    networks:
      - cognitive-net

  # DISTRIBUTED EXECUTION WORKER
  runtime-worker:
    build:
      context: ..
      dockerfile: docker/runtime.Dockerfile
    command: ["node", "dist/runtime-workers/worker-node.js"]
    deploy:
      replicas: 3
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - ollama
    networks:
      - cognitive-net

  # LOCAL AI INFERENCE (Ollama)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - cognitive-net

  # CACHE & MESSAGING (Redis)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - cognitive-net

networks:
  cognitive-net:
    driver: bridge

volumes:
  ollama-data:
